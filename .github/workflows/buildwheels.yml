name: "buildwheels"

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "requirements.txt"
      - "build_backend/**"
      - "src_patches_v624/**"
      - "scripts/**"
      - "stubs/**"
      - "itis_dakota/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/buildwheels.yml"
  push:
    branches: [master]
  schedule:
    - cron: "5 0 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    name: Tag new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract custom version from commit message
        id: custom_version
        if: github.ref == 'refs/heads/master'
        run: |
          MSG=$(git log -1 --format=%B)
          if [[ "$MSG" =~ \#version:([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "tag=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          fi
      - name: Bump version and push tag
        id: tag_version
        if: github.ref == 'refs/heads/master'
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          DEFAULT_BUMP: patch
          CUSTOM_TAG: ${{ steps.custom_version.outputs.tag }}

  wheels-linux:
    name: Build wheel on linux ${{ matrix.python }} ${{ matrix.arch }}
    runs-on: ${{ matrix.github-runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        arch: ["x86_64", "arm64"]
        include:
          - arch: x86_64
            github-runner: "ubuntu-24.04"
            wheel-platform: "x86_64"
          - arch: arm64
            github-runner: "ubuntu-24.04-arm"
            wheel-platform: "aarch64"

    permissions:
      contents: write
    needs: tag
    steps:
      - name: Set cibuildwheel Python version
        run: |
          python_version="${{ matrix.python }}"
          cibw_python="cp${python_version/./}"
          echo "CIBW_PYTHON=$cibw_python" >> $GITHUB_ENV
      - uses: actions/checkout@v6
        if: github.ref != 'refs/heads/master'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        if: github.ref == 'refs/heads/master'
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.new_tag }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - name: Cache Dakota source
        uses: actions/cache@v5
        with:
          path: dakota
          key: dakota-src-v6.24.0-${{ hashFiles('src_patches_v624/*.patch') }}
      - name: Get dakota src
        run: |
          if [ ! -f dakota/CMakeLists.txt ]; then
            make get-dakota-src
          fi
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          # Keyed by compile inputs, not sha, so one run warms many commits.
          key: ccache-linux-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src_patches_v624/*.patch') }}
          restore-keys: ccache-linux-${{ matrix.arch }}-
      - name: Ensure ccache dir exists
        run: mkdir -p .ccache .cibw_wheels_safe
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ env.CIBW_PYTHON }}-*
          CIBW_ARCHS: ${{ matrix.wheel-platform }}
          CIBW_CONTAINER_ENGINE: >-
            docker; create_args: --mount type=bind,source=${{ github.workspace
            }}/.ccache,target=/project/.ccache --mount type=bind,source=${{
            github.workspace
            }}/.cibw_wheels_safe,target=/project/.cibw_wheels_safe
      # Save right after compile, before tests/cancellation can lose it.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src_patches_v624/*.patch') }}
      - name: Verify wheel integrity
        # Shared gate script (CRC check + recovery from .cibw_wheels_safe/,
        # the virtiofs bind-mount copy that dodges Docker Desktop's
        # intermittent `docker cp` BadCRC corruption on macOS-style setups).
        run: python3 scripts/verify_wheels.py
      - name: Show ccache stats
        if: always()
        run: |
          # ccache ran inside the manylinux container but CCACHE_DIR pointed
          # to /project/.ccache which is bind-mounted to $PWD/.ccache on host.
          # Install ccache on the host to read the stats db.
          # Install ccache on the host to read the stats db.
          if ! command -v ccache &>/dev/null; then
            sudo apt-get install -y -qq ccache >/dev/null 2>&1 || true
          fi
          if command -v ccache &>/dev/null && [ -d .ccache ]; then
            STATS=$(CCACHE_DIR="$PWD/.ccache" ccache --show-stats 2>&1) || true
            PARSE=$(CCACHE_DIR="$PWD/.ccache" ccache --print-stats 2>/dev/null) || true
          elif [ -d .ccache ]; then
            STATS="ccache not available on host; cache dir exists ($(du -sh .ccache | cut -f1))"
            PARSE=""
          else
            STATS="No .ccache directory found"
            PARSE=""
          fi
          echo "## ccache stats" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$STATS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          RATE=$(echo "$PARSE" | awk '/^direct_cache_hit/{hits+=$2} /^preprocessed_cache_hit/{hits+=$2} /^cache_miss/{misses+=$2} END{total=hits+misses; if (total>0) printf "%.2f", (hits/total)*100}')
          echo "::notice title=ccache stats - ${{ github.job }}::Hit rate: ${RATE:-unknown}%"
      - name: Run tests
        run: |
          pip install pytest
          # --force-reinstall ensures the just-built wheel is actually
          # installed (otherwise pip skips when the same version is
          # already present from a prior run, e.g. cached test runners
          # or local `act` runs).
          pip install --force-reinstall --no-deps ./wheelhouse/itis_dakota*.whl
          pip install numpy pydantic
          pytest
      - name: Check stubs are up to date
        # Gated to one matrix leg: dakota.environment is already built and
        # installed above, and the check is arch/version-independent (the
        # pybind11-generated API surface doesn't change across platforms).
        # Hard failure (stubgen version is pinned, so any drift here is real).
        if: matrix.python == '3.13' && matrix.arch == 'x86_64'
        run: |
          pip install pybind11-stubgen==2.5.5
          pybind11-stubgen dakota.environment -o /tmp/stub_check
          # Same normalization as scripts/generate_stubs.sh (shared script,
          # see scripts/normalize_stubs.py).
          python3 scripts/normalize_stubs.py /tmp/stub_check/dakota/environment/environment.pyi
          failed=0
          for f in __init__.pyi environment.pyi; do
            if ! diff "/tmp/stub_check/dakota/environment/$f" "stubs/dakota/environment/$f"; then
              echo "::error file=stubs/dakota/environment/$f::Committed stub is stale — run 'make stubs' and commit the result."
              failed=1
            fi
          done
          exit $failed
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ env.CIBW_PYTHON }}_${{ matrix.wheel-platform }}
          path: ./wheelhouse/*.whl

  sbom-scan:
    name: Scan and submit wheel SBOM
    runs-on: ubuntu-latest
    needs: wheels-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download a wheel artifact
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-linux-*
          path: dist
          merge-multiple: true
      - name: Extract SBOM
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          echo "WHEEL=${WHEEL}" >> "$GITHUB_ENV"
          unzip -p "${WHEEL}" "*.dist-info/sboms/auditwheel.cdx.json" > sbom.cdx.json
          python3 scripts/sbom_for_scan.py sbom.cdx.json sbom-for-scan.cdx.json
      - name: Install grype
        run: curl -sSfL https://get.anchore.io/grype | sh -s -- -b /usr/local/bin
      - name: Scan SBOM for known vulnerabilities
        run: |
          grype sbom:sbom-for-scan.cdx.json --distro almalinux:8 -o table
          grype sbom:sbom-for-scan.cdx.json --distro almalinux:8 -o sarif --file results.sarif
      - name: Scan SBOM for vulnerabilities with an available fix
        run: grype sbom:sbom-for-scan.cdx.json --distro almalinux:8 --only-fixed --fail-on medium -o table
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grype-sbom-report
          path: |
            sbom-for-scan.cdx.json
            results.sarif
      - name: Submit SBOM to dependency graph
        if: always()
        run: python3 scripts/submit_sbom_snapshot.py "${WHEEL}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        continue-on-error: true

  lock-check:
    name: Dependency lock check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Check requirements.txt matches pyproject.toml
        run: ./scripts/check_requirements_lock.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: sbom-scan
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true

  wheels-macos:
    name: Build wheels on macos ${{ matrix.name }}
    runs-on: ${{ matrix.github-runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x86_64 (1/3)"
            arch: x86_64
            github-runner: "macos-15-intel"
            wheel-platform: "x86_64"
            cibw-build: "cp312-*"
            group: "1"
            test-python: "3.12"
            test-cp: "cp312"
          - name: "x86_64 (2/3)"
            arch: x86_64
            github-runner: "macos-15-intel"
            wheel-platform: "x86_64"
            cibw-build: "cp313-*"
            group: "2"
            test-python: "3.13"
            test-cp: "cp313"
          - name: "x86_64 (3/3)"
            arch: x86_64
            github-runner: "macos-15-intel"
            wheel-platform: "x86_64"
            cibw-build: "cp314-*"
            group: "3"
            test-python: "3.14"
            test-cp: "cp314"
          - name: "arm64 (1/2)"
            arch: arm64
            github-runner: "macos-15"
            wheel-platform: "arm64"
            cibw-build: "cp312-*"
            group: "1"
            test-python: "3.12"
            test-cp: "cp312"
          - name: "arm64 (2/2)"
            arch: arm64
            github-runner: "macos-15"
            wheel-platform: "arm64"
            cibw-build: "cp313-* cp314-*"
            group: "2"
            test-python: "3.14"
            test-cp: "cp314"

    permissions:
      contents: write
    needs: tag
    steps:
      - uses: actions/checkout@v6
        if: github.ref != 'refs/heads/master'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        if: github.ref == 'refs/heads/master'
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.new_tag }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.test-python }}
          cache: "pip"
      - name: Cache Dakota source
        uses: actions/cache@v5
        with:
          path: dakota
          key: dakota-src-v6.24.0-${{ hashFiles('src_patches_v624/*.patch') }}
      - name: Get dakota src
        run: |
          if [ ! -f dakota/CMakeLists.txt ]; then
            make get-dakota-src
          fi
      - name: Cache Homebrew packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ matrix.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: brew-${{ matrix.arch }}-
      - name: Install macOS build dependencies (Homebrew)
        run: make brew-deps
      - name: Set MACOSX_DEPLOYMENT_TARGET from runner
        # cibuildwheel's default (10.13/11.0) is older than the Homebrew
        # bottles installed on the runner, which makes delocate refuse to
        # bundle them. Pin to the runner's major macOS version.
        run: |
          MAC_MAJOR=$(sw_vers -productVersion | cut -d. -f1).0
          echo "MACOSX_DEPLOYMENT_TARGET=$MAC_MAJOR" >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Caches/ccache
          # Keyed by compile inputs, not sha, so one run warms many commits.
          key: ccache-macos-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src_patches_v624/*.patch') }}
          restore-keys: ccache-macos-${{ matrix.arch }}-
      - name: Zero ccache stats
        run: ccache --zero-stats
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.cibw-build }}
          CIBW_ARCHS: ${{ matrix.wheel-platform }}
      # Save right after compile, before tests/cancellation can lose it.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src_patches_v624/*.patch') }}
      - name: Verify wheel integrity
        run: python3 scripts/verify_wheels.py
      - name: Show ccache stats
        if: always()
        run: |
          echo "## ccache stats" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ccache --show-stats >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY
          RATE=$(ccache --print-stats 2>/dev/null | awk '/^direct_cache_hit/{hits+=$2} /^preprocessed_cache_hit/{hits+=$2} /^cache_miss/{misses+=$2} END{total=hits+misses; if (total>0) printf "%.2f", (hits/total)*100}')
          echo "::notice title=ccache stats - ${{ github.job }}::Hit rate: ${RATE:-unknown}%"
      - name: Run tests
        run: |
          pip install pytest
          # --force-reinstall ensures the just-built wheel is actually
          # installed (otherwise pip skips when the same version is
          # already present from a prior run).
          pip install --force-reinstall --no-deps ./wheelhouse/itis_dakota*${{ matrix.test-cp }}*.whl
          pip install numpy pydantic
          pytest
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.wheel-platform }}-${{ matrix.group }}
          path: ./wheelhouse/*.whl

  # Windows leg (SPEC-Windows.md): win_amd64 × repo python set, mirroring the
  # linux job's per-python matrix. Artifacts follow the `wheels-*` naming
  # convention so the release/test-pypi/pypi download globs pick them up like
  # every other platform (V7df: publish-scope by artifact NAME).
  wheels-windows:
    name: Build wheel on windows ${{ matrix.python }} win_amd64
    runs-on: windows-2025
    permissions:
      contents: write
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set cibuildwheel Python version
        run: |
          python_version="${{ matrix.python }}"
          cibw_python="cp${python_version/./}"
          echo "CIBW_PYTHON=$cibw_python" >> $GITHUB_ENV
      - uses: actions/checkout@v6
        if: github.ref != 'refs/heads/master'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        if: github.ref == 'refs/heads/master'
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.new_tag }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - name: Install msys build tools (make, patch)
        # Same toolchain cibuildwheel's before-all expects; idempotent there.
        run: C:/msys64/usr/bin/bash.exe -lc "pacman -Sy --noconfirm; pacman -S --noconfirm --needed --disable-download-timeout make patch"
      - name: Materialize libboost_regex-mt.a
        # pacman boost 1.92 ships no libboost_regex (Boost.Regex is
        # header-only upstream; only its 2 C-API shims ever compile), yet
        # module-mode FindBoost still demands a real file for the `regex`
        # component. See scripts/build_boost_regex.sh. Ensured here rather
        # than in before-all because cibuildwheel gives windows before-all
        # no repo-root cwd. Runs BEFORE the GITHUB_PATH prepend: once msys
        # usr/bin leads PATH, GH's `shell: bash` resolves to msys bash and
        # step wrappers misbehave (B2gh). Non-login `bash -c` + fully
        # qualified tool paths: the msys LOGIN shell proved unreliable under
        # nested runner invocation (cwd relocation AND silent exit-1).
        run: C:/msys64/usr/bin/bash.exe -c "/usr/bin/pacman -Sy --noconfirm && /usr/bin/pacman -S --noconfirm --needed --disable-download-timeout mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-boost && /usr/bin/bash $PWD/scripts/build_boost_regex.sh"
      - name: Install uv
        # [tool.cibuildwheel] build-frontend = "build[uv]" — cibuildwheel needs
        # uv discoverable on PATH *before* before-all runs (macOS gets it from
        # brew-deps, Linux from the image; on Windows the host python's Scripts
        # dir is on PATH).
        run: python -m pip install --quiet --upgrade uv && uv --version
      - name: Prefer msys tools on PATH
        # make/curl/tar/sed for get-dakota-src (and patch, installed above).
        run: echo "C:/msys64/usr/bin" >> "$GITHUB_PATH"
      - name: Cache Dakota source
        # Platform-specific key: a linux-extracted tree contains symlinks the
        # windows recipe deliberately excludes; sharing caches across platforms
        # would silently resurrect them (or poison the shared key on failure).
        uses: actions/cache@v5
        with:
          path: dakota
          key: dakota-src-win-v6.24.0-${{ hashFiles('src_patches_v624/*.patch') }}
      - name: Get dakota src
        # Same guard as linux/mac jobs: make get-dakota-src starts with
        # `rm -rf dakota`, so it must not run when the cache step above
        # already restored the patched tree.
        run: |
          if [ ! -f dakota/CMakeLists.txt ]; then
            make get-dakota-src
          fi
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: C:/ccache-win
          # run_id-keyed (wim review): actions/cache silently no-ops a save
          # whose primary key already exists, so the old hashFiles key froze
          # the cache at its first save forever. Unique keys make every run
          # persist its objects; restore-keys picks up the newest previous
          # entry (ccache objects are content-addressed, so cross-source
          # restore is safe and hashFiles invalidation was counterproductive).
          # NB: hit rate stays ~0% until the stable build root lands (B31/T14cc
          # — cibw's random per-run temp dir poisons compile-command hashes).
          key: ccache-windows-amd64-${{ github.run_id }}
          restore-keys: ccache-windows-amd64-
      - name: Ensure ccache dir exists
        run: mkdir -p /c/ccache-win
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ env.CIBW_PYTHON }}-*
          CIBW_ARCHS: AMD64
      # Save right after compile, before tests/cancellation can lose it.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: C:/ccache-win
          key: ccache-windows-amd64-${{ github.run_id }}
      - name: Show ccache stats
        if: always()
        # Same reporting as the linux/macos jobs (step-summary block + hit
        # rate notice). ccache ran with CCACHE_DIR=C:/ccache-win (pyproject
        # windows env) and was zeroed in before-all, so these are THIS run's
        # numbers; the ucrt64 binary path is qualified because host bash's
        # PATH lacks ucrt64.
        run: |
          CC=/c/msys64/ucrt64/bin/ccache.exe
          if [ ! -x "$CC" ]; then
            echo "## ccache stats" >> "$GITHUB_STEP_SUMMARY"
            echo "ccache not installed (before-all did not run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export CCACHE_DIR=C:/ccache-win
          echo "## ccache stats" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$CC" --show-stats >> "$GITHUB_STEP_SUMMARY" 2>&1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          RATE=$("$CC" --print-stats 2>/dev/null | awk '/^direct_cache_hit/{hits+=$2} /^preprocessed_cache_hit/{hits+=$2} /^cache_miss/{misses+=$2} END{total=hits+misses; if (total>0) printf "%.2f", (hits/total)*100}')
          echo "::notice title=ccache stats - ${{ github.job }} ${{ matrix.python }}::Hit rate: ${RATE:-unknown}%"
      - name: Verify wheel integrity
        run: python scripts/verify_wheels.py
      - name: Run tests
        run: |
          pip install pytest
          pip install --force-reinstall --no-deps ./wheelhouse/itis_dakota*${{ env.CIBW_PYTHON }}*.whl
          pip install numpy pydantic
          pytest
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ env.CIBW_PYTHON }}_win_amd64
          path: ./wheelhouse/*.whl

  test:
    name: Test wheel on ${{ matrix.os }} ${{ matrix.arch }}
    needs: [wheels-linux, wheels-macos, wheels-windows]
    runs-on: ${{ matrix.github-runner }}
    defaults:
      run:
        # The wheel install below relies on shell glob expansion; pin bash so
        # the windows leg doesn't land on PowerShell (no glob expansion).
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            github-runner: "ubuntu-24.04"
            artifact: "wheels-linux-cp314_x86_64"
          - os: linux
            arch: arm64
            github-runner: "ubuntu-24.04-arm"
            artifact: "wheels-linux-cp314_aarch64"
          - os: macos
            arch: x86_64
            github-runner: "macos-15-intel"
            artifact: "wheels-macos-x86_64-3"
          - os: macos
            arch: arm64
            github-runner: "macos-15"
            artifact: "wheels-macos-arm64-2"
          - os: windows
            arch: x86_64
            github-runner: "windows-2025"
            artifact: "wheels-windows-cp314_win_amd64"
          # Second windows OS generation: the build runner's OS is NOT the
          # support target (mingw ucrt64 wheels run on any UCRT Windows,
          # 7 SP1+); this leg installs the SAME artifact on an older runner
          # to prove that rather than assume it.
          - os: windows-2022
            arch: x86_64
            github-runner: "windows-2022"
            artifact: "wheels-windows-cp314_win_amd64"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse
      - name: Install wheel and run tests
        run: |
          pip install pytest
          pip install --force-reinstall --no-deps wheelhouse/*cp314*.whl
          pip install numpy pydantic
          pytest

  release:
    name: Create new github release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - tag
      - test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.new_tag }}
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.new_tag }}
          generateReleaseNotes: true
          artifacts: dist/*.whl

  test-pypi:
    name: Publish wheels on Test PyPI
    runs-on: ubuntu-latest
    needs:
      - release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/itis-dakota
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish wheels on PyPI
    runs-on: ubuntu-latest
    needs:
      - test-pypi
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: pypi
      url: https://pypi.org/p/itis-dakota
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
