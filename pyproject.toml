[project] 
name = "itis_dakota"
description = "Dakota wheel built by the IT'IS Foundation, Zurich, Switzerland"
license = { file = "LICENSE.txt" }
authors = [
    {name="Werner Van Geit"}
]
readme = {file = "README.md", content-type = "text/markdown"}
dependencies = ["numpy", "pydantic>=2"]
# dakota.spec (Pydantic 2 models: ConfigDict/model_validator/field_validator,
# PEP 604 `X | None` unions evaluated at runtime) requires Python 3.10+;
# floor raised to 3.12 to match the lowest Python actually built/tested by
# the wheel matrix in .github/workflows/buildwheels.yml (3.11 is not built).
requires-python = ">=3.12"
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/ITISFoundation/itis-dakota"
repository = "https://github.com/ITISFoundation/itis-dakota.git"
issues = "https://github.com/ITISFoundation/itis-dakota/issues"

[build-system]
requires = [
    "py-build-cmake",
    "cmake",
    "ninja",
    "auditwheel",
    "setuptools",
    "setuptools_scm",
    "numpy",
    "h5py"
]
build-backend = "build_backend.build"
backend-path = ["."]

[tool.setuptools]
packages = ["itis_dakota"]
package-dir = {"itis_dakota" = "itis_dakota"}

[tool.setuptools.package-data]
itis_dakota = ["py.typed"]

[dependency-groups]
dev = ["pybind11-stubgen==2.5.5", "pre-commit"]

[tool.setuptools_scm]
version_file = "itis_dakota/_version.py"
local_scheme = "no-local-version"

[tool.cibuildwheel]
build-verbosity = 1
build-frontend = "build[uv]"

# NOTE: CMAKE_*_COMPILER_LAUNCHER and ccache vars are set in the
# per-platform [tool.cibuildwheel.{linux,macos}.environment] sections.
# On Linux, CCACHE_DIR points to /project/.ccache so the cache is
# persisted via actions/cache on the host; on macOS ccache uses the
# default ~/Library/Caches/ccache directory.

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
[tool.cibuildwheel.linux]
repair-wheel-command = "./scripts/repair_wheel.sh {dest_dir} {wheel}"
before-all = [
    "pushd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz && popd",
    "yum install -y epel-release yum-utils",
    "yum-config-manager --enable epel",
    "yum makecache --refresh",
    "yum install -y lapack-devel boost1.78-devel blas-devel hdf5-devel zip unzip wget gsl-devel ccache ninja-build perl-JSON-PP",
    "ccache --version",
    "ccache --zero-stats",
    "pip install setuptools_scm",
    "python -m setuptools_scm --force-write-version-files",
]
skip = "*-musllinux_*"
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64"

[tool.cibuildwheel.linux.environment]
BOOST_LIBRARYDIR = "/usr/lib64/boost1.78"
BOOST_INCLUDEDIR = "/usr/include/boost1.78"
CCACHE_DIR = "/project/.ccache"
CCACHE_MAXSIZE = "1G"
CCACHE_COMPRESS = "true"
CCACHE_BASEDIR = "/project"
CCACHE_SLOPPINESS = "include_file_mtime,include_file_ctime,time_macros,pch_defines,file_stat_matches,clang_index_store,system_headers,locale"
CCACHE_NOHASHDIR = "true"
# Build-isolation temp dirs are random, so ignore -I flags into them.
CCACHE_IGNOREOPTIONS = "-I/tmp*"
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
[tool.cibuildwheel.macos]
repair-wheel-command = "./scripts/repair_wheel_macos.sh {dest_dir} {wheel} {delocate_archs}"
before-build = "ccache --show-stats 2>/dev/null | grep -E 'Hits|Misses|hit rate' || true"
# No container on macOS; deps (incl. uv) come from brew-deps, not here.
before-all = [
    "python3 -m venv /tmp/itis-dakota-buildtools",
    "/tmp/itis-dakota-buildtools/bin/python -m pip install --quiet setuptools_scm",
    "/tmp/itis-dakota-buildtools/bin/python -m setuptools_scm --force-write-version-files",
]
environment-pass = [
    "MACOSX_DEPLOYMENT_TARGET"
]

[tool.cibuildwheel.macos.environment]
# Use Homebrew-provided libraries. The prefix differs between Intel
# (/usr/local) and Apple Silicon (/opt/homebrew); resolve at build time.
HOMEBREW_PREFIX = "$(brew --prefix)"
BOOST_ROOT = "$(brew --prefix boost)"
BOOST_LIBRARYDIR = "$(brew --prefix boost)/lib"
BOOST_INCLUDEDIR = "$(brew --prefix boost)/include"
HDF5_ROOT = "$(brew --prefix hdf5)"
GSL_ROOT_DIR = "$(brew --prefix gsl)"
LAPACK_DIR = "$(brew --prefix lapack)"
# gfortran is required by Dakota's TPLs (BLAS/LAPACK linkage). gfortran
# is shipped by the Homebrew `gcc` formula. Use full path so CMake can
# find it even if Homebrew's bin isn't on PATH in the build isolation.
FC = "$(brew --prefix)/bin/gfortran"
# Ensure Homebrew's bin is on PATH so CMake (and other tools) can find
# Homebrew-installed binaries inside cibuildwheel's build-isolation env.
PATH = "$(brew --prefix)/bin:$PATH"
# ccache compiler launchers — ccache uses local disk cache, persisted
# across CI runs via actions/cache.
CCACHE_BASEDIR = "/Users"
CCACHE_SLOPPINESS = "include_file_mtime,include_file_ctime,time_macros,pch_defines,file_stat_matches,clang_index_store,system_headers,locale"
CCACHE_NOHASHDIR = "true"
# Build-isolation temp dirs are random, so ignore -I flags into them.
CCACHE_IGNOREOPTIONS = "-I/private/var/folders* -I/var/folders* -I/tmp*"
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"

# ---------------------------------------------------------------------------
# Windows (win_amd64) — MSYS2/MinGW-w64 ucrt64 toolchain, no MSVC.
# See SPEC-Windows.md. QUESO is not MSVC-clean and MSVC has no Fortran;
# ucrt64 GCC/gfortran is the same mingw-w64 family SciPy uses on Windows
# via rtools, and pacman is the analog of yum (linux) / brew (macos).
# Dakota's own Fortran TPLs (pecos, DIRECT) build with gfortran directly.
# ---------------------------------------------------------------------------
[tool.cibuildwheel.windows]
skip = "pp* *-win32"
repair-wheel-command = "python -m ensurepip && python -m pip install --quiet delvewheel pefile && python ./scripts/repair_wheel_windows.py {dest_dir} {wheel}"
before-all = [
    # MSYS2 ships preinstalled on GitHub windows runners at C:\msys64.
    # `patch`/`make` are needed by `make get-dakota-src`; perl lives in
    # usr/bin already for Dakota's JSON codegen (core JSON::PP module).
    # (scripts/build_boost_regex.sh is NOT invoked here: cibuildwheel's
    # before-all has no repo-root cwd on windows — the CI job runs it.)
    "C:/msys64/usr/bin/bash.exe -lc \"pacman -Sy --noconfirm; pacman -S --noconfirm --needed --disable-download-timeout patch make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-hdf5 mingw-w64-ucrt-x86_64-gsl mingw-w64-ucrt-x86_64-lapack mingw-w64-ucrt-x86_64-ccache\"",
    # Per-run stats baseline (mirrors the linux before-all), so the job's
    # "Show ccache stats" step reports THIS run's hit rate, not the cache's
    # lifetime totals. Full tool path: the login shell lacks ucrt64 on PATH,
    # and ccache.exe arrives via the pacman line above.
    "C:/msys64/usr/bin/bash.exe -lc \"CCACHE_DIR=C:/ccache-win /c/msys64/ucrt64/bin/ccache.exe --zero-stats\"",
]

[tool.cibuildwheel.windows.environment]
# ucrt64 first so CMake/CC resolve gcc/g++/gfortran, never MSVC.
# usr/bin adds perl/tar/sed/patch for Dakota's configure + codegen steps.
PATH = "C:/msys64/ucrt64/bin;C:/msys64/usr/bin;C:/msys64/bin;$PATH"
CC = "gcc"
CXX = "g++"
FC = "gfortran"
# FindBLAS/FindLAPACK/FindHDF5/FindGSL search prefixes (analog of the
# BOOST_*/HDF5_ROOT/GSL_ROOT_DIR vars the linux/mac sections set).
CMAKE_PREFIX_PATH = "C:/msys64/ucrt64"
BOOST_ROOT = "C:/msys64/ucrt64"
BOOST_LIBRARYDIR = "C:/msys64/ucrt64/lib"
BOOST_INCLUDEDIR = "C:/msys64/ucrt64/include"
HDF5_ROOT = "C:/msys64/ucrt64"
GSL_ROOT_DIR = "C:/msys64/ucrt64"
# ccache on Windows: same launcher setup as linux/mac; cache dir kept
# off D: so the runner's disk layout doesn't matter; persisted via
# actions/cache in the wheels-windows CI job.
CCACHE_DIR = "C:/ccache-win"
CCACHE_MAXSIZE = "1G"
CCACHE_COMPRESS = "true"
CCACHE_SLOPPINESS = "include_file_mtime,include_file_ctime,time_macros,pch_defines,file_stat_matches,clang_index_store,system_headers,locale"
CCACHE_NOHASHDIR = "true"
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"

[tool.py-build-cmake.cmake]
source_path = "."
generator = "Ninja"
build_type = "Release"
install_components = ["dakota_for_python"]

[tool.py-build-cmake.cmake.options]
DAKOTA_HAVE_HDF5 = "ON"
HAVE_QUESO = "ON"
DAKOTA_HAVE_GSL = "ON"
DAKOTA_PYTHON_WRAPPER = "ON"
DAKOTA_PYTHON_DIRECT_INTERFACE = "ON"
BUILD_SHARED_LIBS = "ON"
CMAKE_POSITION_INDEPENDENT_CODE = "ON"
CXX_FLAGS = "-w"
CMAKE_CXX_FLAGS = "-Wno-psabi"

# Homebrew Boost 1.90's BoostConfig.cmake is broken (missing
# per-component configs). Force the legacy FindBoost module on macOS.
[tool.py-build-cmake.mac.cmake.options]
Boost_NO_BOOST_CMAKE = "ON"

# MSYS2 Boost ships the boostorg BoostConfig.cmake generated for MSVC
# component naming, which mismatches the mingw-built libboost_*.dll.a
# names. Legacy FindBoost + BOOST_ROOT/BOOST_LIBRARYDIR env finds them.
[tool.py-build-cmake.windows.cmake.options]
Boost_NO_BOOST_CMAKE = "ON"
# UCRT <math.h> hides M_PI etc. under -std=c++17 (__STRICT_ANSI__);
# _USE_MATH_DEFINES opts back in. Needed by e.g. dakota_parser's
# computed_fields.hpp (gumbel_moments). Carries the global -Wno-psabi
# because a platform section's value replaces the global one for the
# same key.
CMAKE_CXX_FLAGS = "-Wno-psabi -D_USE_MATH_DEFINES"
# -std=gnu17: mingw gcc 16 defaults C to C23, where foo() means foo(void).
# Vendored old C (DDACE Bose/*.c: imatrix()/ivector() K&R declarations)
# then fails "too many arguments". gnu17 matches the pre-C23 semantics the
# linux CI's older gcc applies by default. No C_STANDARD properties exist
# in dakota, so this flag is not overridden.
CMAKE_C_FLAGS = "-D_USE_MATH_DEFINES -std=gnu17"

[tool.pytest.ini_options]
addopts = "--ignore=dakota/ --ignore=tmp/"
